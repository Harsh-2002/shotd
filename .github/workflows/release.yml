name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"

permissions:
  actions: read
  contents: write

jobs:
  verify-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            conclusion="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/CI.yml/runs" -f head_sha="$GITHUB_SHA" -f event=push --jq '.workflow_runs[0].conclusion // ""')"
            case "$conclusion" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required) exit 1 ;;
            esac
            sleep 10
          done
          echo "CI did not complete successfully for $GITHUB_SHA." >&2
          exit 1

  build:
    name: macOS arm64
    needs: verify-ci
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Verify build environment
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          if [[ -z "$CERTIFICATE_P12" ]]; then
            echo "Developer ID certificate not configured; using ad-hoc signing."
            exit 0
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          printf '%s' "$CERTIFICATE_P12" | base64 -D > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain
      - name: Build, sign, and notarize
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: arm64
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          OUTPUT_DIRECTORY: dist
          SHOTD_RELEASE_SKIP_TESTS: "1"
        run: Packaging/release.sh
      - name: Create checksums
        working-directory: dist
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          shasum -a 256 shotd-*.zip > SHA256SUMS
          shasum -a 256 package/shotd | cut -d ' ' -f 1 > "shotd-$VERSION-macos-arm64.binary.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" "dist/shotd-$VERSION-macos-arm64.zip" "dist/shotd-$VERSION-macos-arm64.binary.sha256" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" "dist/shotd-$VERSION-macos-arm64.zip" "dist/shotd-$VERSION-macos-arm64.binary.sha256" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "shotd $VERSION" --generate-notes
          fi
      - name: Retire previous published releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' | while IFS= read -r tag; do
            if [[ -n "$tag" && "$tag" != "$VERSION" ]]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain build.keychain || true
